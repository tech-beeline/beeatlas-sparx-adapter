openapi: 3.0.3
info:
  title: Swagger Beeline EA Capability - OpenAPI 3.0
  description: |-
    Интерфейс для управления моделью возможностей в корпоративном архитектурном репозитории Sparx EA
  contact:
    email: ivvoronin@beeline.ru
  version: 0.0.1
tags:
  - name: "Управление доменами"
    description:
      Методы для получения, добавления и изменения описаний доменов возможностей
  - name: Управление возможностями
    description: Методы полученияЮ добавления и изменения описания возможностей
  - name: Управление интерфейсами
    description: Методы полученияЮ добавления и изменения описания интерфейсов
  - name: component
    description: Управление описанием компонентов
  - name: realization
    description: Управление описанием вариантов реализации возможности
paths:
  /api/domains:
    get:
      tags:
        - "Управление доменами"
      operationId: getDomains
      summary: Получение списка доменов
      description: Получение списка доменов верхнево уровня или всех в виде списка
      parameters:
        - name: all
          description: |-
            - true - Получить все домены плоским списком
            - false или отсутствует - Получить список доменов верхнего уровня
          in: query
          required: false
          allowEmptyValue: true
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Domain"
    post:
      tags:
        - "Управление доменами"
      operationId: createDomain
      summary: Регистрация нового домена
      description: |-
        Добавляет в корпоративный репозиторий описание нового домена\
        Каждый новый домен добавлется как поддомен, если указан родитель (поле parent). \
        При добавлении домена сохраняются следующие поля:
        - name, description, status, author
        - Если указан parent, то домен добавляется как поддомен уазанного в этом поле домена. В противном случае добавлявется в корень
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Domain"
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/Domain"
        "400":
          description: Не корректный синтаксис запроса
          content:
            text/plain:
              schema:
                type: string
                example: Не указан имя домена
        "424":
          description: Не верно указан родительский домен
  /api/domains/{code}:
    get:
      tags:
        - "Управление доменами"
      summary: Получение описания домена по его коду
      operationId: getDomainByCode
      parameters:
        - name: code
          in: path
          description: Код запрашиваемого домена
          example: BC-0001
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/Domain"
        "404":
          description: Домен с указанным кодом не найден
    put:
      tags:
        - "Управление доменами"
      summary: Обновление данных для домена
      description: |-
        При добавлении домена сохраняются следующие поля:\
        - name, description, status

      operationId: updateDomain
      parameters:
        - name: code
          in: path
          description: Код домена
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Domain"
      responses:
        "200":
          description: |-
            Обновление прошло успешно\
            В ответе возвращается обновленное описание домена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Domain"
        "404":
          description: Домен с указанным кодом не найден
  /api/domains/{code}/parent:
    put:
      tags:
        - "Управление доменами"
      operationId: setDomainParent
      summary: Изменение перенос поддомена в другой домен
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObjectRef"
      responses:
        "200":
          description: OK
  /api/domains/{code}/subdomains:
    get:
      tags:
        - "Управление доменами"
      summary: Получение описания поддоменов по коду домена
      parameters:
        - name: code
          description: Код домена, для которого запрашивается описание дочерних доменов
          required: true
          in: path
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Domain"
    post:
      tags:
        - "Управление доменами"
      summary: Добавление в домен описание нового поддомена
      operationId: createSubdomain
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Domain"
      responses:
        "200":
          description: OK
  /api/domains/{code}/capabilities:
    get:
      operationId: getDomainCapabilities
      summary: Получение списка возможностей в домене
      tags:
        - "Управление доменами"
      parameters:
        - name: code
          in: path
          description: Код домена
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK. В теле ответа описание запрашиваемых возможностей
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Capability"
    post:
      tags:
        - "Управление доменами"
      operationId: createDomainCapability
      summary: Создание описания новой возможности в домене
      description: ""
      parameters:
        - name: code
          in: path
          description: Код домена
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Capability"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/Capability"
  /api/capabilities:
    get:
      tags:
        - Управление возможностями
      operationId: GetCapabilities
      summary: Получение всех возможностей
      responses:
        "200":
          description: successfull operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Capability"
    post:
      tags:
        - Управление возможностями
      operationId: createCapability
      summary: Создание оприсания новой возможности
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Capability"
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/Capability"
  /api/capabilities/{code}:
    get:
      tags:
        - Управление возможностями
      operationId: getCapabilityByCode
      summary: Получение информации о возможности по ее коду
      parameters:
        - name: code
          in: path
          required: true
          description: Код возможности для получения информации
          schema:
            type: string
            example: BC-0001
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/Capability"
    put:
      tags:
        - Управление возможностями
      operationId: updateCapability
      summary: Обновление описания возможности
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
            example: BC-0001
      requestBody:
        content:
          application/json:
            schema:
              type: object
              $ref: "#/components/schemas/Capability"
            example:
              name: Новое имя
              description: Новое описание
              status: Draft
      responses:
        "200":
          description: successfull operation
          content:
            application/json:
              schema:
                type: object
                $ref: "#/components/schemas/Capability"
  /api/capabilities/{code}/domain:
    put:
      tags:
        - Управление возможностями
      summary: Изменение домена, которому принадлежит возможность
      operationId: changeCapabilityDomain
      parameters:
        - name: code
          in: path
          required: true
          description: Код возможности
          example: BC-0001
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObjectRef"
            example:
              code: "001.001"        
      responses:
        "200": 
          description: OK.
  /api/capabilities/{code}/parent:
    put:
      tags:
        - Управление возможностями
      summary: Установка и изменение родительской возможности
      operationId: changeCapabilityParent
      requestBody: 
        content:
          application/json:
            schema:  
              $ref: "#/components/schemas/ObjectRef"
            example:
              code: "BC-0001"
      responses:
        "200": 
          description: OK.
  /api/capabilities/{code}/children:
    summary: Управление описанием вариантов реализации возможности
    get:
      tags:
        - Управление возможностями
      summary: Получение вариантов реализации TC
      parameters:
        - name: code
          description: Код возможности
          in: path
          required: true
          schema:
            type: string
            example: BC-0001
      responses:
        "200":
          description: successfull operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CapabilityRealization"
    post:
      tags:
        - Управление возможностями
      parameters:
        - name: code
          description: Код возможности
          in: path
          required: true
          schema:
            type: string
            example: BC-0001
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/CapabilityRealization"
  /api/capabilities/{code}/realizations:
    summary: Управление описанием вариантов реализации возможности
    get:
      tags:
        - realization
      summary: Получение вариантов реализации TC
      parameters:
        - name: code
          description: Код возможности
          in: path
          required: true
          schema:
            type: string
            example: BC-0001
      responses:
        "200":
          description: successfull operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CapabilityRealization"
    post:
      tags:
        - realization
      parameters:
        - name: code
          description: Код возможности
          in: path
          required: true
          schema:
            type: string
            example: BC-0001
      responses:
        "200":
          description: successful operation
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/CapabilityRealization"
  /api/interfaces:
    get:
      tags:
        - Управление интерфейсами
      description: Поиск и получение описания интерфейсов
      operationId: getInterfaces
      parameters:
        - name: search
          in: query
          description: Слово для поиска в названии интерфейса
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Interface"
    post:
      tags:
        - Управление интерфейсами
      description: "ДОбавление нового описания интерфейса"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Interface"
      responses:
        "200":
          description: OK
  /api/interfaces/{code}:
    get:
      tags:
        - Управление интерфейсами
      description: ""
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Interface"
    post:
      tags:
        - Управление интерфейсами
      summary: Изменение описания интерфейса
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Interface"
            example:
              name: INewInterface
              description: Изменное описание
              status: Draft
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Interface"
              example:
                code: "API-0001"
                href: https://server/api/interfaces/API-0001
                name: INewInterface
                description: Изменное описание
                status: Draft
                FQName: Application Catalog.DumpApplication.INewInterface
                author: VKIT
  /api/interfaces/{code}/component:
    post:
      tags:
        - Управление интерфейсами
      summary: Изменение приложения-владельца для интерфейса
      operationId: changeInterfaceComponent
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObjectRef"
            example:
              code: APP.CMDB
      responses:
        "200":
          description: OK.
  /api/component:
    get:
      tags:
        - component
      summary: Поиск и получение описание компонентов и продуктов
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
    post:
      tags:
        - component
      summary: Добавление описания компонента
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/Component"
                - type: array
                  items:
                    $ref: "#/components/schemas/Component"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Component"
                  - type: array
                    items:
                      $ref: "#/components/schemas/Component"
  /api/component/{code}:
    get:
      tags:
        - component
      responses:
        "200":
          description: OK
    put:
      tags:
        - component
      responses:
        "200":
          description: OK
  /api/component/{code}/interfaces:
    get:
      tags:
        - component
      responses:
        200:
          description: OK.
    post:
      tags:
        - component
      responses:
        200:
          description: OK.
components:
  schemas:
    Object:
      type: object
      allOf:
        - $ref: "#/components/schemas/ObjectRef"
      properties:
        name:
          type: string
          example: Управление клиентской инфорацией
        FQName:
          type: string
        description:
          type: string
        status:
          type: string
        author:
          type: string
    ObjectRef:
      type: object
      properties:
        code:
          type: string
          example: "001.001"
#        guid:
#          type: string
#          example: "{DAE09FF4-9980-4ce8-B9F8-B686C98CC60B}"
        href:
          type: string
          format: url
          example: http://server/api/ref/001.001
    Domain:
      type: object
      allOf:
        - $ref: "#/components/schemas/Object"
      properties:
        parent:
          type: object
          $ref: "#/components/schemas/ObjectRef"
    Capability:
      type: object
      allOf:
        - $ref: "#/components/schemas/Object"
      properties:
        domain:
          type: object
          $ref: "#/components/schemas/ObjectRef"
        parent:
          type: object
          $ref: "#/components/schemas/ObjectRef"
        kpi:
          type: object
        owner:
          type: object
          $ref: "#/components/schemas/Employee"
        unit:
          type: object
          $ref: "#/components/schemas/ObjectRef"
    Employee:
      type: object
      properties:
        href:
          type: string
          format: url
        email:
          type: string
          format: email
        fullName:
          type: string
    CapabilityRealization:
      allOf:
        - $ref: "#/components/schemas/Object"
      type: object
      properties:
        interfaces:
          type: array
          items:
            $ref: "#/components/schemas/ObjectRef"
    Component:
      type: object
      allOf:
        - $ref: "#/components/schemas/Object"
      properties:
        interfaces:
          type: array
          items:
            $ref: "#/components/schemas/ObjectRef"
    Interface:
      type: object
      allOf:
        - $ref: "#/components/schemas/ObjectRef"
        - $ref: "#/components/schemas/Object"
      properties:
        component:
          type: object
          $ref: "#/components/schemas/ObjectRef"
    DomainPostBody:
      type: object
